# Actions are pinned to commit SHAs; Dependabot maintains these pins.
name: Release
'on':
  push:
    tags:
    - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Retry the NuGet upload using an existing GitHub Release's verified assets
        required: true
        default: v0.1.0
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'schematic-tech/supertest-csharp' && github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
  publish:
    needs:
    - build
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - run: python scripts/release.py guard
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: release-assets
        path: dist
    - run: python scripts/release.py verify-assets
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        dotnet-version: 8.0.x
    - run: test -n "$NUGET_USER" || { echo "Set the NUGET_USER repository variable to your NuGet.org username."
        >&2; exit 1; }
      shell: bash
    - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
      id: auth
      with:
        user: ${{ vars.NUGET_USER }}
    - run: python scripts/publish.py
      env:
        NUGET_API_KEY: ${{ steps.auth.outputs.NUGET_API_KEY }}
    - run: python scripts/release.py github
      env:
        GH_TOKEN: ${{ github.token }}
    env:
      NUGET_USER: ${{ vars.NUGET_USER }}

  retry-upload:
    if: github.repository == 'schematic-tech/supertest-csharp' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - run: |
        python scripts/release.py check --tag "$RELEASE_TAG"
        test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
        gh release download "$RELEASE_TAG" --dir dist
        python scripts/release.py verify-assets
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        dotnet-version: 8.0.x
    - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
      id: auth
      with:
        user: ${{ vars.NUGET_USER }}
    - run: python scripts/publish.py
      env:
        NUGET_API_KEY: ${{ steps.auth.outputs.NUGET_API_KEY }}
